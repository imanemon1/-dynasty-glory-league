<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثبت ترید - Dynasty Glory League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4efe2;--card:#fffaf0;--tx:#241c0c;--mu:#7b6a44;--gold:#a97a08;--ln:#e0d1a6;--neg:#b3321f;--pos:#1d7a45;--blu:#2b5fa8;--amb:#c07a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#090b13;--card:#131826;--tx:#f4ead0;--mu:#a09478;--gold:#f6c744;--ln:#2a2f48;--neg:#ff7a63;--pos:#5fd68e;--blu:#79a8ff;--amb:#ffb341;color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;padding:0 10px 40px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:26px;font-weight:800;margin:22px 0 2px;color:var(--gold);text-align:center}
.sub{text-align:center;color:var(--mu);margin:0 0 14px;font-size:14px}
.back{display:inline-block;color:var(--mu);font-size:13px;text-decoration:none;margin-top:12px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu)}
input,select{box-sizing:border-box;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;font:inherit;font-size:16px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:-1px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
.top input{width:100%;margin-top:4px;text-align:center;font-weight:700}
#fa{display:block;text-align:center;color:var(--gold);font-weight:700;font-size:13px;margin-top:3px}

/* sheet */
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border:1px solid var(--ln);border-radius:12px}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--card);color:var(--mu);font-weight:600;font-size:12px;padding:6px 3px;border-bottom:1px solid var(--ln);white-space:nowrap}
th.g{color:var(--gold)}
td{padding:4px 3px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap;background:var(--bg)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--card) 60%,var(--bg))}
tr.on td{background:color-mix(in srgb,var(--gold) 9%,var(--bg))!important}
.n{position:sticky;right:0;z-index:1;font-weight:800;min-width:38px;border-left:1px solid var(--ln)}
th.n{z-index:2}
.n.e{color:var(--mu);font-weight:400;opacity:.5}
td input{width:100%;text-align:center;padding:5px 2px}
.s{width:86px}.h{width:96px;direction:ltr}.p,.u{width:62px;font-weight:700;direction:ltr}.nt{width:150px;text-align:right!important}
td select{padding:5px 2px;font-weight:700;width:84px}
td button{margin:0;min-width:40px;height:36px;padding:0 4px;background:var(--bg);color:var(--mu);border:1.5px solid var(--ln);border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.c-pos{background:var(--pos)!important;border-color:var(--pos)!important;color:#fff!important}
.c-neg{background:var(--neg)!important;border-color:var(--neg)!important;color:#fff!important}
.c-amb{background:var(--amb)!important;border-color:var(--amb)!important;color:#fff!important}
.c-blu{background:var(--blu)!important;border-color:var(--blu)!important;color:#fff!important}
.c-gold{background:var(--gold)!important;border-color:var(--gold)!important;color:#1a1205!important}
.t{min-width:34px!important}
.sep{border-right:2px solid var(--ln)}
.bad{outline:2px solid var(--neg)!important;outline-offset:-2px}
tfoot td{background:var(--card)!important;font-weight:800;border-bottom:0;direction:ltr}
.pos{color:var(--pos)}.neg{color:var(--neg)}

.sum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.sum span{background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;direction:ltr}
.hint{font-size:12px;color:var(--mu);margin:8px 0 0;text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;margin:12px auto 0}
.go{grid-column:1/-1;background:var(--gold);color:#1a1205;border:0;border-radius:12px;padding:13px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
#st{margin-top:10px;font-size:13px;min-height:20px;text-align:center}
#st.ok{color:var(--pos)}#st.er{color:var(--neg)}
pre{white-space:pre-wrap;direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin:8px 0 0;unicode-bidi:plaintext}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../">← صفحه‌ی اصلی</a>
<h1>ثبت ترید</h1>
<p class="sub">هر ترید یک خط. آخر روز «ثبت روز» را بزن تا همه‌ی تریدها در یک پیام کپی شوند.</p>

<div class="box">
<div class="top">
<label>شماره‌ی اولین ترید امروز<input type="number" id="start" min="1" step="1" inputmode="numeric"></label>
<label>تاریخ<input type="date" id="date"><span id="fa"></span></label>
</div>

<div class="sc">
<table>
<thead><tr>
<th class="n">#</th><th>استراتژی</th><th>ساعت</th><th>جهت</th><th>نتیجه</th><th>±</th><th>پیپ</th><th>دلار</th>
<th class="g sep">1m</th><th class="g">5m</th><th class="g">15m</th><th class="g">30m</th><th class="g">1h</th>
<th class="sep">انبرک</th><th>یادداشت</th>
</tr></thead>
<tbody id="tb"></tbody>
<tfoot><tr><td class="n">Σ</td><td id="fc" colspan="5"></td><td id="fp"></td><td id="fu"></td><td colspan="7"></td></tr></tfoot>
</table>
</div>
<datalist id="sl"></datalist>
<p class="hint">جهت، ±، روند و انبرک با هر بار زدن عوض می‌شوند. TP علامت را «+» و SL آن را «−» می‌کند. همه‌چیز خودکار روی گوشی ذخیره می‌شود.</p>

<div class="sum" id="sum"></div>

<div class="btns">
<button class="go" type="button" id="send">ثبت روز و کپی پیام</button>
<button class="alt" type="button" id="more">➕ یک ردیف دیگر</button>
<button class="alt" type="button" id="reset">🗑 برگه‌ی جدید</button>
</div>
<div id="st"></div>
<div id="out" hidden>
<pre id="msg"></pre>
<div class="btns"><button class="alt" type="button" id="cp" style="grid-column:1/-1">کپی دوباره</button></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const K={st:'dgl_strats',no:'dgl_last_no',day:'dgl_day'};
const N=10, TF=['1m','5m','15m','30m','1h'], RES=['TP','CLOSE','RISK','SL'];
const DIR={'':['·',''],BUY:['▲ B','c-pos'],SELL:['▼ S','c-neg']};
const TRD={'':['·',''],UP:['▲','c-pos'],DOWN:['▼','c-neg'],RANGE:['↔','c-amb']};
const RC={TP:'c-pos',CLOSE:'c-blu',RISK:'c-amb',SL:'c-neg'};
const cyc=(o,v)=>{const k=Object.keys(o);return k[(k.indexOf(v)+1)%k.length]};

const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const faParts=(v,loc,opt)=>{const [y,m,d]=v.split('-').map(Number);return new Intl.DateTimeFormat(loc,{...opt,timeZone:'UTC'}).formatToParts(new Date(Date.UTC(y,m-1,d))).reduce((o,p)=>(o[p.type]=p.value,o),{})};
const faDate=v=>{if(!v)return '';const q=faParts(v,'fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric'});return q.weekday+' '+q.day+' '+q.month+' '+q.year.replace(/[^۰-۹0-9]/g,'')};
const faNum=v=>{if(!v)return '-';const q=faParts(v,'en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});return q.year.replace(/\D/g,'')+'/'+q.month+'/'+q.day};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const clean=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
const r2=x=>Math.round(x*100)/100;
const sgn=x=>(x>0?'+':'')+x;

const blank=()=>({s:'',h:'',d:'',r:'',sg:1,p:'',u:'',t:{},a:false,n:''});
const fresh=()=>({date:today(),start:(+localStorage.getItem(K.no)||0)+1,rows:Array.from({length:N},blank)});
let D;try{D=JSON.parse(localStorage.getItem(K.day))}catch(e){}
if(!D||!Array.isArray(D.rows))D=fresh();
const save=()=>localStorage.setItem(K.day,JSON.stringify(D));

const strats=()=>JSON.parse(localStorage.getItem(K.st)||'[]');
const fillStrats=()=>{$('sl').innerHTML=strats().map(s=>`<option value="${esc(s)}">`).join('')};
fillStrats();

const filled=r=>!!(r.d||r.r||r.p!==''||r.u!=='');
const val=(r,k)=>r2(r.sg*(parseFloat(r[k])||0));

// header fields
$('start').value=D.start;$('date').value=D.date;
const showFa=()=>{$('fa').textContent=faDate($('date').value)};showFa();
$('start').oninput=()=>{D.start=+$('start').value||1;save();upd()};
$('date').oninput=$('date').onchange=()=>{D.date=$('date').value;showFa();save()};

// sheet
const tb=$('tb');
function rowHTML(r,i){
  return `<tr data-i="${i}"><td class="n"></td>
<td><input class="s" data-k="s" list="sl" value="${esc(r.s)}" placeholder="—"></td>
<td><input class="h" data-k="h" type="time" value="${esc(r.h||'')}"></td>
<td><button type="button" class="d"></button></td>
<td><select class="r" data-k="r"><option value="">—</option>${RES.map(x=>`<option${r.r===x?' selected':''}>${x}</option>`).join('')}</select></td>
<td><button type="button" class="sg"></button></td>
<td><input class="p" data-k="p" inputmode="decimal" value="${esc(r.p)}" placeholder="0"></td>
<td><input class="u" data-k="u" inputmode="decimal" value="${esc(r.u)}" placeholder="0"></td>
${TF.map((t,j)=>`<td${j?'':' class="sep"'}><button type="button" class="t" data-tf="${t}"></button></td>`).join('')}
<td class="sep"><button type="button" class="a"></button></td>
<td><input class="nt" data-k="n" value="${esc(r.n)}" placeholder="—"></td></tr>`;
}
function paint(i){
  const tr=tb.children[i],r=D.rows[i],q=s=>tr.querySelector(s);
  const [dt,dc]=DIR[r.d];q('.d').textContent=dt;q('.d').className='d '+dc;
  q('.sg').textContent=r.sg>0?'+':'−';q('.sg').className='sg '+(r.sg>0?'c-pos':'c-neg');
  q('.r').className='r '+(RC[r.r]||'');
  tr.querySelectorAll('.t').forEach(b=>{const [x,c]=TRD[r.t[b.dataset.tf]||''];b.textContent=x;b.className='t '+c});
  q('.a').textContent=r.a?'✓':'·';q('.a').className='a '+(r.a?'c-gold':'');
  tr.classList.toggle('on',filled(r));
}
function render(){tb.innerHTML=D.rows.map(rowHTML).join('');D.rows.forEach((_,i)=>paint(i));upd()}

function numbers(){let k=+D.start||1;return D.rows.map(r=>filled(r)?k++:null)}
function stats(){
  const L=D.rows.filter(filled),c={TP:0,CLOSE:0,RISK:0,SL:0};
  let p=0,u=0;L.forEach(r=>{if(c[r.r]!=null)c[r.r]++;p+=val(r,'p');u+=val(r,'u')});
  return {n:L.length,c,p:r2(p),u:r2(u)};
}
function upd(){
  const nums=numbers();
  [...tb.children].forEach((tr,i)=>{const td=tr.firstElementChild;td.textContent=nums[i]??'·';td.classList.toggle('e',nums[i]==null)});
  const s=stats(),cl=x=>x>0?'pos':x<0?'neg':'';
  $('fc').textContent=s.n+' ترید';
  $('fp').innerHTML=`<span class="${cl(s.p)}">${sgn(s.p)}</span>`;
  $('fu').innerHTML=`<span class="${cl(s.u)}">${sgn(s.u)}$</span>`;
  $('sum').innerHTML=s.n?`<span>${s.n} trade</span>`+RES.map(k=>`<span>${k} ${s.c[k]}</span>`).join('')+`<span class="${cl(s.p)}">PIPS ${sgn(s.p)}</span><span class="${cl(s.u)}">$ ${sgn(s.u)}</span><span>WIN ${Math.round(s.c.TP/s.n*100)}%</span>`:'';
}

tb.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;if(!k)return;
  const i=+el.closest('tr').dataset.i,r=D.rows[i];
  if(k==='p'||k==='u'){const c=clean(el.value);if(c!==el.value)el.value=c}
  r[k]=el.value;
  if(k==='r'){if(r.r==='TP')r.sg=1;if(r.r==='SL')r.sg=-1}
  el.classList.remove('bad');paint(i);save();upd();
});
tb.addEventListener('change',e=>{if(e.target.dataset.k==='s'){const i=+e.target.closest('tr').dataset.i;D.rows[i].s=e.target.value.trim();save()}});
// prefill strategy from the row above
tb.addEventListener('focusin',e=>{
  const el=e.target;if(!el.classList.contains('s')||el.value)return;
  const i=+el.closest('tr').dataset.i;
  for(let j=i-1;j>=0;j--)if(D.rows[j].s){el.value=D.rows[i].s=D.rows[j].s;save();setTimeout(()=>el.select(),0);break}
});
tb.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.closest('tr').dataset.i,r=D.rows[i];
  if(b.classList.contains('d'))r.d=cyc(DIR,r.d);
  else if(b.classList.contains('sg'))r.sg=-r.sg;
  else if(b.classList.contains('t'))r.t[b.dataset.tf]=cyc(TRD,r.t[b.dataset.tf]||'');
  else if(b.classList.contains('a'))r.a=!r.a;
  b.classList.remove('bad');paint(i);save();upd();
});

$('more').onclick=()=>{D.rows.push(blank());save();render()};
$('reset').onclick=()=>{
  if(D.rows.some(filled)&&!confirm('همه‌ی ردیف‌ها پاک شوند و برگه‌ی جدید باز شود؟'))return;
  D=fresh();save();$('start').value=D.start;$('date').value=D.date;showFa();$('out').hidden=true;say('');render();
};

function say(t,c){const s=$('st');s.textContent=t;s.className=c||''}

function build(){
  const nums=numbers(),s=stats(),L=[];
  L.push('#TRADES');
  L.push('تاریخ: '+D.date+' | شمسی: '+faNum(D.date));
  L.push('فرمت: شماره | استراتژی | ساعت | جهت | نتیجه | پیپ | دلار | روند '+TF.join(',')+' | انبرک | یادداشت');
  D.rows.forEach((r,i)=>{if(nums[i]==null)return;
    L.push([nums[i],r.s.trim(),r.h||'-',r.d,r.r,sgn(val(r,'p')),sgn(val(r,'u')),TF.map(t=>r.t[t]||'-').join(','),r.a?'بله':'خیر',r.n.trim()||'-'].join(' | '));
  });
  L.push('جمع: '+s.n+' ترید | '+RES.map(k=>k+' '+s.c[k]).join(' · ')+' | PIPS '+sgn(s.p)+' | $ '+sgn(s.u));
  return L.join('\n');
}

async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}

$('send').onclick=async()=>{
  tb.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  const nums=numbers();let err=[];
  D.rows.forEach((r,i)=>{if(nums[i]==null)return;const tr=tb.children[i],miss=[];
    if(!r.s.trim()){miss.push('استراتژی');tr.querySelector('.s').classList.add('bad')}
    if(!r.d){miss.push('جهت');tr.querySelector('.d').classList.add('bad')}
    if(!r.r){miss.push('نتیجه');tr.querySelector('.r').classList.add('bad')}
    if(miss.length)err.push('ترید '+nums[i]+': '+miss.join('، '));
  });
  if(!nums.some(x=>x!=null)){say('هنوز هیچ تریدی وارد نشده.','er');return}
  if(err.length){say('ناقص است ← '+err.join(' / '),'er');return}

  const text=build();$('msg').textContent=text;$('out').hidden=false;
  localStorage.setItem(K.no,Math.max(...nums.filter(x=>x!=null)));
  const list=strats();let ch=false;
  D.rows.forEach(r=>{const s=r.s.trim();if(s&&!list.includes(s)){list.push(s);ch=true}});
  if(ch){localStorage.setItem(K.st,JSON.stringify(list));fillStrats()}
  const ok=await copy(text);
  say(ok?'✅ پیام همه‌ی تریدها کپی شد؛ برای من بفرست.':'پیام آماده است؛ «کپی دوباره» را بزن.',ok?'ok':'er');
};
$('cp').onclick=async()=>say((await copy($('msg').textContent))?'کپی شد.':'کپی نشد؛ متن را دستی انتخاب کن.','ok');

render();
</script>
</body>
</html>
