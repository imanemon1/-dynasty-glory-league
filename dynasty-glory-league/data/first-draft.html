<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty Glory League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4efe2;--card:#fffaf0;--tx:#241c0c;--mu:#7b6a44;--gold:#a97a08;--ln:#e0d1a6;--neg:#b3321f;--pos:#1d7a45;color-scheme:light;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090b13;--card:#131826;--tx:#f4ead0;--mu:#a09478;--gold:#f6c744;--ln:#2a2f48;--neg:#ff7a63;--pos:#5fd68e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090b13;--card:#131826;--tx:#f4ead0;--mu:#a09478;--gold:#f6c744;--ln:#2a2f48;--neg:#ff7a63;--pos:#5fd68e;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;padding:0 14px 40px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:clamp(28px,8vw,46px);font-weight:800;margin:22px 0 2px;letter-spacing:.5px;color:var(--gold);direction:ltr;text-align:center}
.sub{text-align:center;color:var(--mu);margin:0 0 16px;font-size:14px}
.lvl{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;font-size:14px}
.bar{position:relative;height:10px;background:var(--ln);border-radius:6px;margin:34px 6px 8px}
.fill{height:100%;background:var(--gold);border-radius:6px;transition:width .6s}
.mk{position:absolute;top:-24px;transform:translateX(50%);font-size:12px;color:var(--mu);text-align:center}
.mk.on{color:var(--gold);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.st{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:20px;color:var(--gold)}
.st span{font-size:12px;color:var(--mu)}
.stage{perspective:700px;margin:26px 0 8px;height:230px;display:flex;justify-content:center;align-items:flex-end;gap:8px;direction:ltr}
.step{width:30%;max-width:200px;text-align:center;transform:rotateX(16deg);transform-origin:bottom;background:linear-gradient(180deg,var(--gold),#6b4d05);color:#1a1205;border-radius:10px 10px 0 0;box-shadow:0 22px 30px -14px rgba(0,0,0,.55);padding-top:10px;transition:transform .3s}
.step:hover{transform:rotateX(4deg) translateY(-4px)}
.step i{font-style:normal;font-size:28px;display:block}
.step b{display:block;font-size:16px;direction:ltr}
.step small{font-size:12px;font-weight:600}
.s1{height:190px}.s2{height:140px;filter:brightness(.88)}.s3{height:105px;filter:brightness(.75)}
.cups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.cup{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}
.cup.on{border-color:var(--gold);color:var(--tx)}
.cup b{display:block;color:var(--gold);font-size:14px;direction:ltr}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;text-align:center}
th,td{padding:8px 6px;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:600;font-size:12px}
td.t{font-weight:800;direction:ltr}
td.p{font-weight:800;color:var(--gold)}
.neg{color:var(--neg)}.pos{color:var(--pos)}
tr:first-child td{background:rgba(246,199,68,.08)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:12px;color:var(--mu)}
#gate{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:9;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
#gate.off{display:none}
#gate h2{color:var(--gold);text-align:center;margin:0 0 4px}
.g{max-width:560px;margin:0 auto}
.g h3{font-size:14px;color:var(--mu);margin:14px 0 4px}
.g label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14px;cursor:pointer}
.g input{margin-top:6px;accent-color:var(--gold);width:18px;height:18px;flex:none}
.g label:has(input:checked){border-color:var(--gold)}
.q{text-align:center;font-weight:600;margin:16px 0;color:var(--gold)}
.go{display:block;width:100%;background:var(--gold);color:#1a1205;font-weight:800;border:0;padding:12px}
.go:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="gate"><div class="g">
<h2>قوانین لیگ</h2>
<p class="sub">هر قانون را بخوان و تیک بزن تا وارد لیگ شوی.</p>
<div id="rules"></div>
<p class="q">«کار من اجرای درست است، نه پول درآوردن.»</p>
<button class="go" id="go" disabled>ورود به لیگ</button>
</div></div>

<div class="wrap">
<h1>DYNASTY GLORY</h1>
<p class="sub">لیگ استراتژی‌ها</p>
<div class="lvl"><span>پله‌ی فعلی: Initiate</span><span>لات ۰٫۱۰</span><span id="tot"></span></div>
<div class="bar" id="bar"><div class="fill" id="fill"></div></div>
<div class="stats" id="stats"></div>
<div class="stage" id="stage"></div>
<div class="cups" id="cups"></div>
<div class="tw"><table><thead><tr><th>#</th><th>تیم</th><th>play</th><th>SL</th><th>RISK</th><th>CLOSE</th><th>TP</th><th>WIN%</th><th>R/R</th><th>PIPS</th><th>$</th><th>POINT</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="acts"><button id="demo">نمایش با داده‌ی نمونه</button><button id="zero">پاک کردن</button><button id="rl">قوانین</button></div>
<p class="note">POINT = PIPS + (TP × 5) + (CLOSE × 2) − SL. دلار در امتیاز نیست و فقط ارزش تیم را نشان می‌دهد.</p>
</div>

<script>
var RULES=[["do","فقط ستاپ، نه حس","بدون ستاپ کامل ورود ممنوع؛ هیچ تریدی از روی حوصله، ترس یا هیجان."],
["do","صبر تا ناحیه","دنبال قیمت ندو. یا میاد به ناحیه‌ات، یا اصلاً تریدی نیست."],
["do","دو ضربه، کافیه","اگر از یک ناحیه ۲ بار SL خوردی، تا ستاپ جدید ورود ممنوع."],
["do","اول حفظ سرمایه","ریسک ثابت، استاپ دست‌نخورده."],
["do","ذهنت رئیس است","عصبانی، عجول، خسته یا بیش‌ازحد هیجان‌زده؟ ترید نکن."],
["dont","نکنه دنبال جبران ضرر بری","Revenge trade بزرگ‌ترین دشمنته. ضرر بخشی از بازیه، نه توهین شخصی."],
["dont","نکنه حجم رو زود زیاد کنی","حجم بالا قبل از زمانش یعنی نابودی پلکان. اول ثبات، بعد قدرت."],
["dont","نکنه وسط معامله نظرت عوض شه","پلن که چیدی تا پایان همون پلنه. دست‌کاری SL/TP از ترس یا طمع ممنوع."],
["dont","نکنه تو بازار بی‌تصمیم ترید کنی","رنج، خبر، کندل‌های درهم = صبر."],
["dont","نکنه با بقیه مقایسه کنی","مسیر تو، پلکان تو، لیگ تو."]];
var NAMES=["HDM","HDR","A1","LK-A1","LK"];
var DEMO=[[2,1,1,6,40,420,40,330],[3,0,2,4,55,310,55,205],[1,2,0,3,20,180,20,120],[2,1,1,2,35,150,35,60],[4,0,0,1,60,90,60,-10]];
var teams=zero();
function zero(){return NAMES.map(function(n){return{n:n,sl:0,risk:0,close:0,tp:0,pn:0,pp:0,qn:0,qp:0}})}
function demo(){return NAMES.map(function(n,i){var d=DEMO[i];return{n:n,sl:d[0],risk:d[1],close:d[2],tp:d[3],pn:d[4],pp:d[5],qn:d[6],qp:d[7]+d[6]}})}
function calc(t){var play=t.sl+t.risk+t.close+t.tp,pips=t.pp-t.pn;
return{n:t.n,sl:t.sl,risk:t.risk,close:t.close,tp:t.tp,play:play,win:play?t.tp/play*100:0,rr:t.pn?t.pp/t.pn:0,pips:pips,usd:t.qp-t.qn,pt:pips+t.tp*5+t.close*2-t.sl}}
function cls(v){return v<0?"neg":v>0?"pos":""}
function f(v,d){return v.toFixed(d||0)}
function render(){
var r=teams.map(calc).sort(function(a,b){return b.pt-a.pt||b.win-a.win}),tot=0;
r.forEach(function(x){tot+=x.play});
document.getElementById("tot").textContent=tot+" / 100 ترید";
document.getElementById("fill").style.width=Math.min(tot,100)+"%";
var bar=document.getElementById("bar");bar.querySelectorAll(".mk").forEach(function(e){e.remove()});
[50,75,100].forEach(function(m){var e=document.createElement("div");e.className="mk"+(tot>=m?" on":"");e.style.right=m+"%";e.textContent=m;bar.appendChild(e)});
var lead=tot>0?r[0].n:"—";
document.getElementById("cups").innerHTML=[50,75,100].map(function(m){var on=tot>=m;return'<div class="cup'+(on?" on":"")+'">🏆 جام '+m+' ترید<b>'+(on?lead:"قفل")+'</b>'+(on?"برنده":"پیشتاز: "+lead)+'</div>'}).join("");
var by=function(k){var b=null;r.forEach(function(x){if(x.play&&(!b||x[k]>b[k]))b=x});return b};
var w=by("win"),q=by("rr"),u=by("usd"),p=tot?r[0]:null;
document.getElementById("stats").innerHTML=[["بیشترین امتیاز",p?f(p.pt):"—",p?p.n:""],["بهترین وین‌ریت",w?f(w.win,1)+"%":"—",w?w.n:""],["بهترین R/R",q?f(q.rr,2):"—",q?q.n:""],["بیشترین سود دلاری",u?"$"+f(u.usd):"—",u?u.n:""]].map(function(s){return'<div class="st"><b>'+s[1]+'</b><span>'+s[0]+(s[2]?" · "+s[2]:"")+'</span></div>'}).join("");
var o=[1,0,2],ic=["🥇","🥈","🥉"];
document.getElementById("stage").innerHTML=o.map(function(i){var x=r[i];return'<div class="step s'+(i+1)+'"><i>'+ic[i]+'</i><b>'+x.n+'</b><small>'+f(x.pt)+' امتیاز</small></div>'}).join("");
document.getElementById("rows").innerHTML=r.map(function(x,i){return'<tr><td>'+(i+1)+'</td><td class="t">'+x.n+'</td><td>'+x.play+'</td><td>'+x.sl+'</td><td>'+x.risk+'</td><td>'+x.close+'</td><td>'+x.tp+'</td><td>'+f(x.win,1)+'</td><td>'+f(x.rr,2)+'</td><td class="'+cls(x.pips)+'">'+f(x.pips)+'</td><td class="'+cls(x.usd)+'">'+f(x.usd)+'</td><td class="p">'+f(x.pt)+'</td></tr>'}).join("")}
var gate=document.getElementById("gate"),go=document.getElementById("go");
document.getElementById("rules").innerHTML=RULES.map(function(r,i){return(i==0?'<h3>بکن</h3>':i==5?'<h3>نکن</h3>':"")+'<label><input type="checkbox"><span><b>'+r[1]+'</b><br>'+r[2]+'</span></label>'}).join("");
function chk(){go.disabled=!!gate.querySelector("input:not(:checked)")}
gate.addEventListener("change",chk);
go.onclick=function(){gate.classList.add("off")};
document.getElementById("rl").onclick=function(){gate.querySelectorAll("input").forEach(function(c){c.checked=false});chk();gate.classList.remove("off");gate.scrollTop=0};
document.getElementById("demo").onclick=function(){teams=demo();render()};
document.getElementById("zero").onclick=function(){teams=zero();render()};
render();
</script>
</body>
</html>
