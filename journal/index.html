<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر روزانه - پیش‌نمایش</title>
<style>
body{margin:0;background:#f2eee1;font-family:Tahoma,sans-serif;color:#3a2f12;padding:14px}
h1{color:#a87a0c;text-align:center;margin:6px 0}
.note{background:#fff3cd;border:1px dashed #a87a0c;border-radius:10px;padding:8px;text-align:center;font-size:13px;margin-bottom:12px}
.bar{text-align:center;font-size:13px;margin-bottom:12px;color:#7a6a3a}
.card,.form{background:#fffaf0;border:1px solid #e3d5a5;border-radius:16px;padding:12px;margin-bottom:14px;box-shadow:0 6px 14px #0002}
.imgs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ph{aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,#111a2e,#0a0d18);color:#bca058;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid #bca058}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.score{background:#a87a0c;color:#fff;border-radius:999px;padding:4px 14px;font-weight:bold}
.tag{display:inline-block;background:#efe3b8;border-radius:999px;padding:4px 10px;margin:3px;font-size:12px}
.tag.on{background:#a87a0c;color:#fff}
label{font-size:13px;display:block;margin-top:10px}
input[type=range]{width:100%}
textarea,input[type=date]{width:100%;box-sizing:border-box;border:1px solid #e3d5a5;border-radius:8px;padding:8px;background:#fff}
button{width:100%;margin-top:12px;background:#a87a0c;color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px}
.file{border:1px dashed #a87a0c;border-radius:8px;padding:10px;text-align:center;font-size:12px;margin-top:6px}
</style></head><body>
<h1>دفتر روزانه</h1>
<div class="bar">NASDAQ · سشن نیویورک</div>
<div class="note">⚠️ این فقط پیش‌نمایش است. داده‌ها و عکس‌ها نمونه‌اند و ذخیره نمی‌شوند.</div>

<div class="form">
<b>ثبت روز جدید</b>
<label>تاریخ<input type="date" value="2026-10-20"></label>
<div class="file">۱ دقیقه: انتخاب عکس</div>
<div class="file">۵ دقیقه: انتخاب عکس</div>
<div class="file">۱۵ / ۳۰ / ۱ ساعته: انتخاب عکس</div>
<label>امروز چند درصد آگاه و خوب بودم؟ <b id="v">70</b><input type="range" min="1" max="100" value="70" oninput="v.textContent=this.value"></label>
<label>برچسب‌ها (با لمس روشن/خاموش)</label>
<div id="tags"></div>
<label>یادداشت<textarea rows="2" placeholder="مثلاً: بعد از خبر ۳ بار تله زد"></textarea></label>
<button>ذخیره</button>
</div>

<div class="card">
<div class="imgs"><div class="ph">1m</div><div class="ph">5m</div><div class="ph">15m·30m·1h</div></div>
<div class="row"><span>۲۰۲۶-۱۰-۲۰</span><span class="score">۷۰</span></div>
<span class="tag">رنج</span><span class="tag">شکست کاذب</span><span class="tag">من آرام</span>
<p style="font-size:13px">نمونه: بعد از خبر ۳ بار تله زد.</p>
</div>

<script>
["روند","رنج","برگشتی","خبری","شکست کاذب","شکار استاپ","فیک‌اوت","گپ","بازار حریص","بازار ترسیده","من آرام","من عجول","FOMO","انتقام"].forEach((t,i)=>{
const s=document.createElement('span');s.className='tag'+(i==1||i==4?' on':'');s.textContent=t;
s.onclick=()=>s.classList.toggle('on');tags.appendChild(s)});
</script></body></html>
